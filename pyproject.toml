[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycon-davao-model2vec-demo"
version = "0.1.0"
description = "Code behind Tuklas, a Tagalog static embedding model built for the PyCon Davao 2026 talk"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
experiment = [
  "datasets==5.0.1",
  "model2vec[distill]==0.9.0",
  "tokenlearn==0.2.1",
  "sentence-transformers==5.7.0",
  "transformers==5.3.0",
  "huggingface-hub==1.33.0",
  "ir-measures==0.4.3",
  "torch==2.14.0",
  "numpy==2.5.3",
  "psutil",
]

[tool.setuptools.packages.find]
where = ["src"]
